name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

env:
  GCP_PROJECT: tcc-ii-392618
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  IMAGE: zatti/tcc-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        context: ./backend
        push: true
        tags: ${{ env.IMAGE }}:${{ github.sha }}

    - name: Setup Google Cloud SDK
      uses: google-github-actions/setup-gcloud@master
      with:
        project_id: ${{ env.GCP_PROJECT }}
        service_account_key: ${{ env.GCP_SA_KEY }}

    - name: Deploy to Kubernetes
      run: |
        echo "$GCP_SA_KEY" > gcp-sa.json
        gcloud auth activate-service-account --key-file=gcp-sa.json
        gcloud container clusters get-credentials your-cluster-name --zone your-zone

        # Update the Kubernetes Deployment to use the new image tag
        kubectl set image deployment/backend-deploy backend=${{ env.IMAGE }}:${{ github.sha }}

