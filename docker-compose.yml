version: '3'

services:
  virtuoso-server:
    image: openlink/virtuoso-opensource-7
    environment:
      - DBA_PASSWORD=123
    volumes:
      - type: bind
        source: ./data/database
        target: /database
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8890"]
      interval: 10s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
    depends_on:
      virtuoso-server:
        condition: service_healthy
    environment:
      - VIRTUOSO_JDBC_URL=jdbc:virtuoso://virtuoso-server:1111/
      - VIRTUOSO_JDBC_USER=dba
      - VIRTUOSO_JDBC_PASSWORD=123
      - VIRTUOSO_GRAPH=http://zatti.alexandre/OntoReD

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://practicesforred.com/backend 
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    ports:
      - "9980:80"
      - "9443:443"
    volumes:
      - type: bind
        source: ./nginx/conf
        target: /etc/nginx/conf.d
    depends_on:
      - frontend
      - backend
